<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Provincia Bolívar</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
        }

        .barra {
            width: 100%;
            height: 12px;
            background-color: #800020;
        }

        .contenedor {
            width: 100%;
            height: calc(100% - 12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 180px;
            margin-bottom: 20px;
        }

        h1 {
            color: #800020;
            font-size: 42px;
            margin: 10px;
        }

        h2 {
            color: black;
            font-size: 24px;
            font-weight: normal;
            margin: 15px;
        }

        .linea {
            width: 180px;
            height: 4px;
            background-color: #800020;
            margin: 15px 0;
        }

        .ubicacion {
            font-size: 20px;
            color: black;
        }

        .siglas {
            color: #800020;
            font-size: 34px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="barra"></div>

    <div class="contenedor">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb1wIaeK2OrPbtL0wD2s20eGM-k7CU1K2UEjkvrhgSpg&s=10.png" class="logo">

        <h1>UNIDAD EDUCATIVA FISCAL<br>PROVINCIA BOLÍVAR</h1>

        <div class="linea"></div>

        <h2>“Educación, valores y compromiso para el futuro”</h2>

        <p class="ubicacion">UBICACION: SAUCES 5 AVE ANTONIO PARRA VELASCO AREA COMUNAL

Guayaquil, Guayas</p>

        <div class="siglas">PB</div>

    </div>

</body>

</html>
